name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check aegis tests examples scripts

      - name: Type check (no suppressed error codes)
        run: mypy aegis

      - name: Test
        run: pytest -q

      # Regression guard: `main.py` used to import the Tk UI at module scope,
      # so the whole CLI failed on any machine without tkinter.
      - name: CLI must work with no GUI toolkit
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys, textwrap
          script = textwrap.dedent("""
              import sys
              sys.modules['tkinter'] = None
              from click.testing import CliRunner
              from aegis.main import cli
              result = CliRunner().invoke(cli, ['--help'])
              assert result.exit_code == 0, result.output
              assert 'plan' in result.output and 'undo' in result.output
              print('CLI works without tkinter')
          """)
          sys.exit(subprocess.run([sys.executable, '-c', script]).returncode)
          PY

      - name: Demo must run end to end
        run: python examples/demo.py

  minimal-install:
    name: works with only the three required dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # No [dev], no [desktop] — just click, platformdirs, cryptography.
      - run: pip install -e .
      - name: plan / apply / undo cycle
        run: |
          set -e
          mkdir -p /tmp/dl /tmp/cfg
          for f in a.pdf b.mp3 c.png; do printf 'x%.0s' {1..200} > /tmp/dl/$f; touch -d '5 days ago' /tmp/dl/$f; done
          cat > /tmp/cfg/config.json <<JSON
          {"desktop_path":"/tmp/dl","downloads_path":"/tmp/dl","archive_root":"/tmp/arch",
           "reports_root":"/tmp/rep","snippets_root":"/tmp/snip","quarantine_root":"/tmp/quar"}
          JSON
          aegis --config /tmp/cfg/config.json plan downloads
          aegis --config /tmp/cfg/config.json apply --yes
          test ! -f /tmp/dl/a.pdf
          aegis --config /tmp/cfg/config.json undo
          test -f /tmp/dl/a.pdf
          echo "plan/apply/undo verified on a minimal install"

  security:
    name: security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"

      # The vault must never fall back to a home-grown cipher, and must never
      # store a credential. Both were true of v0.1.3.
      - name: Vault and secret-exclusion invariants
        run: pytest tests/test_secrets.py tests/test_vault.py -q

      # Boundaries, authorisation and undo.
      - name: Safety model invariants
        run: pytest tests/test_plan_and_journal.py -q

      # Aegis starts exactly one external process — `open_path`, which reveals a
      # folder in the file manager and refuses files. Anything else is a bug.
      - name: No shell execution of user or model input
        run: |
          offenders=$(grep -rnE "os\.system|os\.popen|shell=True|\beval\(|\bexec\(" \
                        aegis/ --include='*.py' || true)
          if [ -n "$offenders" ]; then
            echo "::error::found a shell/eval call in aegis/"; echo "$offenders"; exit 1
          fi
          subs=$(grep -rln "subprocess" aegis/ --include='*.py' || true)
          if [ "$subs" != "aegis/core/utils.py" ]; then
            echo "::error::subprocess used outside aegis/core/utils.py:"; echo "$subs"; exit 1
          fi
          echo "the only external process is open_path in aegis/core/utils.py"
