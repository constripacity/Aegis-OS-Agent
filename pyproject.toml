[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-os-agent"
version = "0.1.3"
description = "Offline clipboard and desktop organizer agent"
readme = "README.md"
authors = [{ name = "Aegis Contributors" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["clipboard", "organizer", "offline", "ollama", "desktop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "click>=8.1",
    "platformdirs>=3.10",
    "pyperclip>=1.8",
    "pypiwin32>=223; sys_platform == 'win32'",
]

[project.optional-dependencies]
ui = ["flet>=0.12", "pystray>=0.19", "pynput>=1.7"]
vision = ["pillow>=10.3", "pytesseract>=0.3", "opencv-python>=4.10"]
bundle = ["pyinstaller>=6.5"]

[project.urls]
Homepage = "https://github.com/constripacity/Aegis-OS-Agent"
Source = "https://github.com/constripacity/Aegis-OS-Agent"
Issues = "https://github.com/constripacity/Aegis-OS-Agent/issues"

[project.scripts]
aegis = "aegis.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*", "examples*"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# The event-bus protocol uses Callable[[Event], None] but real subscribers
# register concrete handlers (Callable[[FileSystemEvent], None] etc.) — this
# is a known design choice that mypy can't see through. Same for the intent
# router's heterogeneous-return dict. Until either is refactored, suppress
# the resulting noise rather than littering the code with per-line ignores.
disable_error_code = ["arg-type", "call-overload", "dict-item", "attr-defined"]
